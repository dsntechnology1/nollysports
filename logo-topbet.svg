<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3a0000;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="300" height="120" rx="14" fill="url(#bgGrad)"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="10" height="120" rx="5" fill="url(#goldGrad)"/>
  <!-- TOP text -->
  <text x="28" y="58" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="52" fill="url(#goldGrad)" letter-spacing="-1">TOP</text>
  <!-- BET text -->
  <text x="28" y="108" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1">BET</text>
  <!-- Stars right side -->
  <text x="192" y="52" font-family="Arial" font-size="20" fill="#FFD700">★★★</text>
  <!-- Small tagline -->
  <text x="192" y="78" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.65)" letter-spacing="1">SPORTS</text>
  <text x="192" y="96" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.45)" letter-spacing="0.5">BETTING</text>
  <!-- Right accent dot -->
  <circle cx="278" cy="24" r="10" fill="#FFD700" opacity="0.9"/>
</svg>
